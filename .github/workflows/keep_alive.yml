name: Keep Supabase Alive

on:
  schedule:
    # Se ejecuta a las 00:00 UTC todos los lunes y jueves (cada 3-4 días)
    - cron: '0 0 * * 1,4'
  workflow_dispatch: # Permite ejecutar la tarea manualmente si lo deseas

jobs:
  ping_supabase:
    runs-on: ubuntu-latest
    steps:
      - name: Hacer consulta a la Base de Datos
        run: |
          curl -X GET "${{ secrets.SUPABASE_URL }}/rest/v1/lugares?select=id&limit=1" \
          -H "apikey: ${{ secrets.SUPABASE_KEY }}" \
          -H "Authorization: Bearer ${{ secrets.SUPABASE_KEY }}"
